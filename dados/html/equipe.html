<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipe Sociopedagógica</title>

    <link rel="stylesheet" href="../css/equipe.css">

</head>

<body>

<header>

    <div class="logo">
        <img src="../img/if.png" alt="Logo Instituto Federal">
    </div>

    <div class="titulo">

        <h1>Instituto Federal</h1>

        <h2>Form Empático</h2>

        <p>Cadastro da Equipe Sociopedagógica</p>

    </div>

</header>

<div class="formulario">

<h2>Cadastro da Equipe Sociopedagógica</h2>

<form action="#" method="post">

    <div class="form-group">

        <label>Nome Completo</label>

        <input type="text"
        placeholder="Digite seu nome completo"
        required>

    </div>

    <div class="form-group">

        <label>Cargo</label>

        <select required>

            <option value="">Selecione o cargo</option>

            <option>Psicólogo(a)</option>

            <option>Assistente Social</option>

            <option>Pedagogo(a)</option>

            <option>Orientador(a) Educacional</option>

            <option>Coordenador(a)</option>

            <option>Outro</option>

        </select>

    </div>

    <button class="botao">

        Entrar

    </button>

</form>

<a href="../index.html" class="voltar">

    ← Voltar para a página inicial

</a>


</form>



</div>

<footer>

Instituto Federal de Educação, Ciência e Tecnologia

</footer>

</body>

</html>
